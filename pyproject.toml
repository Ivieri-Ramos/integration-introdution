[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "integration-introdution"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "app>=0.0.1",
    "lark>=1.3.1",
    "sympy>=1.14.0",
    "typer>=0.27.1",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/integration_app"]