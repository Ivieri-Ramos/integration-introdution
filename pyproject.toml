[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "integration-introdution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "app>=0.0.1",
    "click>=8.5.0",
    "lark>=1.3.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "sympy>=1.14.0",
    "typer>=0.16.0",
    "typer-shell>=1.0.3",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/integration_app"]
